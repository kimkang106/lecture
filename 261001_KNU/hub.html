<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강의 진행 콘솔 · 2022 개정교육과정과 고교학점제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F7; --paper:#FFFFFF; --ink:#16223B; --ink2:#55627E; --line:#D3DAE8; --grid:rgba(22,34,59,.055);
  --hl:#FFE566; --hl-soft:#FFF4B8; --hl-edge:#E2C200; --pen:#D22B45;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --paper:#182036; --ink:#E9EEF9; --ink2:#A5B1CB; --line:#2B3654; --grid:rgba(233,238,249,.05);
    --hl-soft:#3B3618; --hl-edge:#C9A92A; --pen:#FF6B81;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1524; --paper:#182036; --ink:#E9EEF9; --ink2:#A5B1CB; --line:#2B3654; --grid:rgba(233,238,249,.05);
  --hl-soft:#3B3618; --hl-edge:#C9A92A; --pen:#FF6B81;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl-edge);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;line-height:1.2}
.top .sub{font-size:13px;color:var(--ink2)}
.sp{flex:1}
.clock{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.badge{font-size:12.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:99px;padding:2px 10px;background:var(--paper)}
.badge.live{background:var(--pen);color:#fff;border-color:var(--pen)}
.tg{border:1.5px solid var(--ink);background:var(--paper);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13.5px}
.tg.on{background:var(--ink);color:var(--paper)}
.tg[disabled]{opacity:.45;cursor:default}
.main{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:860px){.main{grid-template-columns:1fr}}
/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px;align-content:start}
.tl button{display:grid;grid-template-columns:54px 1fr;gap:8px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tl .n{font-weight:500;line-height:1.35;word-break:keep-all}
.tl li.sel button{border-color:var(--ink);background:var(--hl-soft);box-shadow:3px 3px 0 var(--ink)}
.tl li.sel .n{font-weight:700}
.tl li.done button{opacity:.5}
.tl li.rest .n{color:var(--ink2)}
.tl li.now button::before{content:"";}
.tl li.now .t{color:var(--pen)}
/* panel */
.panel{background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;padding:18px 20px 20px;box-shadow:5px 5px 0 var(--ink);min-width:0}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1.2;margin:0;word-break:keep-all}
.rng{color:var(--ink2);font-weight:700;margin-top:2px}
.rem{text-align:right}
.rem .lb{font-size:13px;color:var(--ink2);font-weight:700}
.rem .tm{font-family:var(--display);font-size:clamp(40px,5vw,64px);line-height:1.05;font-variant-numeric:tabular-nums}
.rem .tm.warn{color:var(--pen)}
.rem .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:9px;padding:5px 12px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block}
.btn.pri{background:var(--hl);color:#16223B;box-shadow:2px 2px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;font-size:14.5px;background:var(--bg)}
.chip.s{border-color:var(--ink)}
.sec{margin-top:18px}
.sec h3{margin:0 0 6px;font-size:13.5px;color:var(--ink2)}
.qrs{display:flex;flex-wrap:wrap;gap:18px}
.qr{width:min(300px,100%)}
.qr .box{display:block;width:100%;background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:10px;cursor:zoom-in}
.qr .box svg,.qr .box img{display:block;width:100%;height:auto}
.qr .lb{font-weight:700;margin-top:8px;word-break:keep-all}
.qr .u{font-size:12.5px;color:var(--ink2);word-break:break-all}
.qr .row{display:flex;gap:6px;margin-top:6px}
.empty{color:var(--ink2);border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px}
ul.plain{margin:0;padding-left:1.15em}
ul.plain li{margin:4px 0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--bg)}
.nextb{margin-top:18px;padding-top:12px;border-top:1.5px dashed var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink2)}
.nextb b{color:var(--ink)}
/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.88);display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.ov .in{background:#fff;border-radius:18px;padding:18px;max-width:94vw;max-height:94vh;text-align:center;color:#16223B}
.ov .in .q{width:min(78vh,82vw)}
.ov .in .q svg,.ov .in .q img{display:block;width:100%;height:auto}
.ov .cap{font-family:var(--display);font-size:clamp(22px,3vw,34px);margin-top:8px}
.ov .hint{font-size:14px;color:#55627E}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div><h1>강의 진행 콘솔</h1><div class="sub">2022 개정교육과정과 고교학점제 · 국립공주대 2026. 10. 1.</div></div>
  <span class="sp"></span>
  <span class="badge" id="mode"></span>
  <button class="tg" id="auto">자동 따라가기</button>
  <div class="clock" id="clock">--:--</div>
</div></header>
<div class="main">
  <ul class="tl" id="tl"></ul>
  <section class="panel" id="panel"></section>
</div>
<div class="ov" id="ov" hidden><div class="in"><div class="q" id="ovq"></div><div class="cap" id="ovc"></div><div class="hint">화면을 누르거나 Esc를 누르면 닫혀요</div></div></div>

var $=function(id){return document.getElementById(id)};
function mins(hm){var p=hm.split(":");return +p[0]*60+ +p[1]}
function pad(n){return n<10?"0"+n:""+n}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));var m=Math.floor(sec/60),s=sec%60;return m+":"+pad(s)}
function isDay(d){return d.getFullYear()===2026&&d.getMonth()===9&&d.getDate()===1}
function nowMin(d){return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function liveIndex(d){
  if(!isDay(d))return -1;
  var m=nowMin(d);
  for(var i=0;i<BLOCKS.length;i++){if(m>=mins(BLOCKS[i].s)&&m<mins(BLOCKS[i].e))return i}
  return -1;
}
var st={i:0,auto:true,tm:{run:false,left:0,end:0}};
(function init(){
  var d=new Date(),li=liveIndex(d);
  if(li>=0){st.i=li}else if(isDay(d)){
    var m=nowMin(d);
    if(m<mins(BLOCKS[0].s))st.i=0;
    else{for(var k=0;k<BLOCKS.length;k++){if(mins(BLOCKS[k].s)>m){st.i=k;break}st.i=BLOCKS.length-1}}
  }
  st.auto=isDay(d)&&li>=0;
  resetTimer();
})();
function dur(i){return (mins(BLOCKS[i].e)-mins(BLOCKS[i].s))*60}
function resetTimer(){st.tm.run=false;st.tm.left=dur(st.i)}

function qrHtml(key){
  var L=LINKS[key];
  var vis=L.svg?L.svg:'<img alt="'+L.label+' QR" src="'+L.img+'">';
  var open=L.url?'<a class="btn" href="'+L.url+'" target="_blank" rel="noopener">새 탭에서 열기</a>':'';
  return '<div class="qr"><button class="box" data-fs="'+key+'" aria-label="'+L.label+' QR 크게 보기">'+vis+'</button>'+
    '<div class="lb">'+L.label+'</div>'+(L.url?'<div class="u">'+L.url.replace(/^https?:\/\//,"")+'</div>':'<div class="u">업로드한 출결 링크 이미지</div>')+
    '<div class="row">'+open+'</div></div>';
}
function render(){
  var d=new Date(),li=liveIndex(d),b=BLOCKS[st.i],live=(st.i===li);
  $("mode").textContent=li>=0?"진행 중":(isDay(d)?"강의 시간 외":"미리보기");
  $("mode").className="badge"+(li>=0?" live":"");
  var at=$("auto");at.disabled=!isDay(d);at.className="tg"+(st.auto&&isDay(d)?" on":"");at.textContent="자동 따라가기 "+(st.auto&&isDay(d)?"ON":"OFF");
  var cm=nowMin(d);
  $("tl").innerHTML=BLOCKS.map(function(x,i){
    var cls=(i===st.i?"sel ":"")+(x.rest?"rest ":"")+(i===li?"now ":"")+((isDay(d)&&cm>=mins(x.e))?"done":"");
    return '<li class="'+cls+'"><button data-i="'+i+'"><span class="t">'+x.s+'</span><span class="n">'+x.title+'</span></button></li>';
  }).join("");
  var chips=(b.slides||[]).map(function(s){return '<span class="chip s">슬라이드 · '+s+'</span>'}).join("")+(b.cards?'<span class="chip">'+b.cards+'</span>':"");
  var qrs=b.qrs&&b.qrs.length?'<div class="sec"><h3>학생에게 띄울 QR (누르면 크게)</h3><div class="qrs">'+b.qrs.map(qrHtml).join("")+'</div></div>':'<div class="sec"><div class="empty">이 구간은 슬라이드로만 진행합니다. 띄울 QR이 없어요.</div></div>';
  var steps=b.steps?'<div class="sec"><h3>진행 순서</h3><ul class="steps">'+b.steps.map(function(x){return '<li><span>'+x[0]+'</span><b>'+x[1]+'</b></li>'}).join("")+'</ul></div>':"";
  var note=b.note?'<div class="sec"><h3>메모</h3><div>'+b.note+'</div></div>':"";
  var checks=b.checks&&b.checks.length?'<div class="sec"><h3>체크</h3><ul class="plain">'+b.checks.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div>':"";
  var nx=BLOCKS[st.i+1];
  $("panel").innerHTML='<div class="ph"><div><h2>'+b.title+'</h2><div class="rng">'+b.s+' ~ '+b.e+' · '+Math.round(dur(st.i)/60)+'분</div></div>'+
    '<div class="rem"><div class="lb" id="rlb"></div><div class="tm" id="rtm"></div><div class="btns" id="rbtn"></div></div></div>'+
    '<div class="chips">'+chips+'</div>'+qrs+steps+note+checks+
    '<div class="nextb"><span>'+(nx?'다음 <b>'+nx.s+' '+nx.title+'</b>':'<b>마지막 구간입니다</b>')+'</span><span>← → 키로 구간 이동</span></div>';
  paintTimer();
}
function paintTimer(){
  var d=new Date(),li=liveIndex(d),live=(st.i===li);
  var lb=$("rlb"),tmEl=$("rtm"),bt=$("rbtn");if(!lb)return;
  var left;
  if(live){left=(mins(BLOCKS[st.i].e)*60-(nowMin(d)*60));lb.textContent="이 구간 남은 시간";bt.innerHTML=""}
  else{
    if(st.tm.run)st.tm.left=Math.max(0,(st.tm.end-Date.now())/1000);
    left=st.tm.left;lb.textContent=st.tm.run?"남은 시간":"예정 시간";
    bt.innerHTML='<button class="btn pri" data-t="go">'+(st.tm.run?"일시정지":"시작")+'</button><button class="btn" data-t="rs">처음으로</button>';
  }
  tmEl.textContent=fmt(left);tmEl.className="tm"+(left<=60&&(live||st.tm.run)?" warn":"");
  $("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes());
}
function go(i){st.i=Math.max(0,Math.min(BLOCKS.length-1,i));resetTimer();render()}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-i]");
  if(t){st.auto=false;go(+t.getAttribute("data-i"));return}
  var f=e.target.closest("[data-fs]");
  if(f){openFs(f.getAttribute("data-fs"));return}
  var tt=e.target.closest("[data-t]");
  if(tt){
    if(tt.getAttribute("data-t")==="go"){
      if(st.tm.run){st.tm.left=Math.max(0,(st.tm.end-Date.now())/1000);st.tm.run=false}
      else if(st.tm.left>0){st.tm.end=Date.now()+st.tm.left*1000;st.tm.run=true}
    }else resetTimer();
    render();return
  }
  if(e.target.id==="auto"){
    var d=new Date();if(!isDay(d))return;
    st.auto=!st.auto;if(st.auto){var li=liveIndex(d);if(li>=0)go(li)}render();return
  }
  if(!$("ov").hidden)closeFs();
});
function openFs(key){
  var L=LINKS[key];
  $("ovq").innerHTML=L.svg?L.svg:'<img alt="" src="'+L.img+'">';
  $("ovc").textContent=L.label;$("ov").hidden=false;
}
function closeFs(){$("ov").hidden=true}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeFs();return}
  if(e.key==="ArrowRight"){st.auto=false;go(st.i+1)}
  else if(e.key==="ArrowLeft"){st.auto=false;go(st.i-1)}
  else if(e.key==="f"||e.key==="F"){var b=BLOCKS[st.i];if(b.qrs&&b.qrs.length)openFs(b.qrs[0])}
});
setInterval(function(){
  var d=new Date(),li=liveIndex(d);
  if(st.auto&&li>=0&&li!==st.i){go(li);return}
  paintTimer();
},500);
render();
})();
</script>
